<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE Robot Control</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/panels.css">
    <link rel="stylesheet" href="/static/css/gamepad.css">
    <script src="/static/js/vendor/socket.io.min.js"></script>
    <script src="/static/js/script.js" defer></script>
    <script src="/static/js/gamepad.js" defer></script>
    <script src="/static/js/gamepad_diag.js" defer></script>
</head>
<body>

    <div id="main-container">

        <!-- Camera Feed (single robot stream) -->
        <div id="camera-grid">
            <div class="camera-slot offline" id="cam-0">
                <div class="camera-label">EVE Camera</div>
                <canvas class="camera-feed" id="feed-0"></canvas>
                <div class="camera-offline">OFFLINE</div>
            </div>
        </div>

        <!-- Live Diagnostics Panel (overlaid bottom-left) -->
        <div id="diagnostics-panel">
            <div class="diag-title">LIVE DIAGNOSTICS</div>
            <div class="diag-grid">
                <!-- Front -->
                <div class="diag-cell diag-front" id="diag-front">
                    <span class="diag-dir">FRONT</span>
                    <span class="diag-val" id="diag-front-val">—</span>
                </div>
                <!-- Left -->
                <div class="diag-cell diag-left" id="diag-left">
                    <span class="diag-dir">LEFT</span>
                    <span class="diag-val" id="diag-left-val">0 cm</span>
                </div>
                <!-- Center: Euler angles -->
                <div class="diag-cell diag-center">
                    <div class="euler-row"><span class="euler-label">X</span><span class="euler-value" id="euler-x">0.00°</span></div>
                    <div class="euler-row"><span class="euler-label">Y</span><span class="euler-value" id="euler-y">0.00°</span></div>
                    <div class="euler-row"><span class="euler-label">Z</span><span class="euler-value" id="euler-z">0.00°</span></div>
                </div>
                <!-- Right -->
                <div class="diag-cell diag-right" id="diag-right">
                    <span class="diag-dir">RIGHT</span>
                    <span class="diag-val" id="diag-right-val">0 cm</span>
                </div>
                <!-- Back -->
                <div class="diag-cell diag-back" id="diag-back">
                    <span class="diag-dir">BACK</span>
                    <span class="diag-val" id="diag-back-val">—</span>
                </div>
            </div>
        </div>

        <!-- PlayStation Gamepad Visual Tester (overlaid bottom-right) -->
        <div id="ps-gamepad-tester">
            <div class="ps-tester-title">GAMEPAD</div>
            <div class="ps-layout">
                <!-- Left Stick -->
                <div class="ps-stick-area">
                    <div class="ps-stick-label">Ls</div>
                    <div class="ps-stick-ring" id="ps-stick-ring">
                        <div class="ps-stick-dot" id="ps-stick-dot"></div>
                    </div>
                    <div class="ps-stick-values">
                        <span id="ps-ls-x">0.00</span>
                        <span id="ps-ls-y">0.00</span>
                    </div>
                </div>
                <!-- Shape Buttons -->
                <div class="ps-buttons-area">
                    <div class="ps-btn-grid">
                        <div class="ps-btn-placeholder"></div>
                        <div class="ps-shape-btn" id="ps-btn-triangle" data-btn="triangle" title="Triangle">
                            <svg viewBox="0 0 32 32"><polygon points="16,6 28,26 4,26" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
                        </div>
                        <div class="ps-btn-placeholder"></div>
                        <div class="ps-shape-btn" id="ps-btn-square" data-btn="square" title="Square">
                            <svg viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
                        </div>
                        <div class="ps-btn-center-label">EVE</div>
                        <div class="ps-shape-btn" id="ps-btn-circle" data-btn="circle" title="Circle">
                            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
                        </div>
                        <div class="ps-btn-placeholder"></div>
                        <div class="ps-shape-btn" id="ps-btn-cross" data-btn="cross" title="Cross">
                            <svg viewBox="0 0 32 32"><line x1="8" y1="8" x2="24" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="24" y1="8" x2="8" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                        </div>
                        <div class="ps-btn-placeholder"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar (centered bottom) -->
        <div id="status-bar" style="display: flex; justify-content: center; align-items: center; width: 100%;">

            <!-- Controller -->
            <div class="status-item" id="controller-section">
                <div id="control-box" class="controller-indicator">
                    <span class="controller-text">CONTROLLER</span>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Gamepad Config -->
            <div class="status-item" id="gamepad-btn-section">
                <button id="gamepad-open-btn" class="dashboard-link-btn" title="Open Gamepad Config">&#127918; Gamepad</button>
            </div>

            <div class="divider"></div>

            <!-- Power Off -->
            <div class="status-item" id="poweroff-section">
                <button id="sys-poweroff-btn" class="poweroff-btn" title="Shutdown Robot">&#9211;</button>
            </div>

        </div>

        <!-- Gamepad Config Overlay -->
        <div id="gamepad-overlay">
            <div class="gamepad-panel">
                <div class="gamepad-panel-header">
                    <span class="gamepad-panel-title">&#127918; Gamepad Configuration</span>
                    <button id="gamepad-panel-close" class="gamepad-panel-close" title="Close">&times;</button>
                </div>
                <div class="gamepad-panel-body">
                    {% include '_sec_gamepad.html' %}
                </div>
            </div>
        </div>

    </div>

    <!-- Notification -->
    <div id="notification">
        <div id="notification-title"></div>
        <div id="notification-message"></div>
    </div>

    <!-- Shutdown Confirm Dialog -->
    <div id="dash-confirm-overlay" class="confirm-overlay">
        <div class="confirm-dialog">
            <div class="confirm-icon">&#9211;</div>
            <div class="confirm-title">Shutdown Robot?</div>
            <div class="confirm-message">This will power off EVE.</div>
            <div class="confirm-buttons">
                <button class="confirm-btn cancel" id="dash-confirm-cancel">Cancel</button>
                <button class="confirm-btn confirm-shutdown" id="dash-confirm-action">Shutdown</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var overlay        = document.getElementById('gamepad-overlay');
        var openBtn        = document.getElementById('gamepad-open-btn');
        var closeBtn       = document.getElementById('gamepad-panel-close');
        var powerBtn       = document.getElementById('sys-poweroff-btn');
        var confirmOverlay = document.getElementById('dash-confirm-overlay');
        var confirmCancel  = document.getElementById('dash-confirm-cancel');
        var confirmAction  = document.getElementById('dash-confirm-action');

        function openOverlay() {
            overlay.classList.add('open');
            if (window.GamepadManager) window.GamepadManager.noEmit = true;
        }
        function closeOverlay() {
            overlay.classList.remove('open');
            if (window.GamepadManager) window.GamepadManager.noEmit = false;
        }

        if (openBtn)  openBtn.addEventListener('click', openOverlay);
        if (closeBtn) closeBtn.addEventListener('click', closeOverlay);
        if (overlay)  overlay.addEventListener('click', function (e) {
            if (e.target === overlay) closeOverlay();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeOverlay();
                if (confirmOverlay) confirmOverlay.classList.remove('show');
            }
        });

        if (powerBtn) powerBtn.addEventListener('click', function () {
            if (confirmOverlay) confirmOverlay.classList.add('show');
        });
        if (confirmCancel) confirmCancel.addEventListener('click', function () {
            if (confirmOverlay) confirmOverlay.classList.remove('show');
        });
        if (confirmAction) confirmAction.addEventListener('click', function () {
            if (confirmOverlay) confirmOverlay.classList.remove('show');
            var sock = window._appSocket;
            if (sock) sock.emit('shutdown');
        });
        if (confirmOverlay) confirmOverlay.addEventListener('click', function (e) {
            if (e.target === confirmOverlay) confirmOverlay.classList.remove('show');
        });
    });
    </script>

</body>
</html>
